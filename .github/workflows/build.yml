name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is already installed on GitHub's ubuntu runners.

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Show the errors as annotations on the run page
            grep -E "error:|e: |What went wrong|ERROR:" -A2 build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ProWriter.apk

      # Keeps a copy on the run page as well
      - uses: actions/upload-artifact@v4
        with:
          name: ProWriter-apk
          path: ProWriter.apk

      # Publishes the APK on the Releases page so it can be downloaded
      # straight to a phone (no zip to unpack).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pro Writer (build ${{ github.run_number }})
          body: Download ProWriter.apk below and open it on your phone to install.
          files: ProWriter.apk
          make_latest: true
