plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prowriter.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.prowriter.app"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    // A fixed key so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No extra libraries needed: the app uses only built-in Android classes.
