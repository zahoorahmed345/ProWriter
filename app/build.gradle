plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prowriter.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.prowriter.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No extra libraries needed: the app uses only built-in Android classes.
